name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Rede de seguranca do gate das contas de demonstracao. O `npm run build`
      # ja roda a mesma verificacao (scripts/verifica-bundle.mjs), inclusive no
      # build da Vercel; este passo e a segunda barreira, e falha FECHADA: dist
      # ausente ou vazio aborta em vez de passar em silencio.
      - name: Garantir que nenhuma credencial de demonstracao entrou no bundle
        run: npm run verifica:bundle
      - run: npm test

  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    name: E2E (Playwright + Supabase dedicado)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: sigauto-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Preparar migracoes do banco E2E
        shell: bash
        run: |
          mkdir -p supabase/migrations
          rm -f supabase/migrations/*.sql
          for arquivo in database/[0-9][0-9]_*.sql; do
            base="$(basename "$arquivo")"
            case "$base" in
              04_seed_data.sql|10_seed_demo.sql) continue ;;
            esac
            numero="${base%%_*}"
            nome="${base#*_}"
            cp "$arquivo" "supabase/migrations/202610150000${numero}_${nome}"
          done
      - name: Iniciar e migrar Supabase efemero
        shell: bash
        run: |
          supabase start
          supabase db reset --local --no-seed
          eval "$(supabase status -o env)"
          echo "VITE_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
          echo "DATABASE_URL=${DB_URL}" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: react-app
      - run: npm ci
        working-directory: backend
      - name: Iniciar API para autenticacao E2E
        shell: bash
        run: |
          nohup npm start > "$RUNNER_TEMP/sigauto-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sigauto-backend.pid"
          for tentativa in {1..30}; do
            if curl --fail --silent http://localhost:3001/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sigauto-backend.log"
          exit 1
        working-directory: backend
        env:
          FRONTEND_URL: http://localhost:5173
          LOGIN_RATE_LIMIT_MAX: 100
      - name: Criar fixtures deterministicas
        run: node e2e/setup-database.mjs
        working-directory: react-app
      - name: Provar idempotencia e validar seguranca do banco
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/29_hardening_os_usuario_estoque.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/30_historico_chatbot_gestor.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/31_historico_painel_ia_gestor.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/32_login_bloqueio_persistente.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/33_historico_status_os.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/34_regras_negocio_servidor.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/35_bloqueio_login_auth_hook.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/rls_matrix_test.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/estoque_os_test.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/hardening_29_test.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/chatbot_financeiro_test.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/login_bloqueio_test.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/login_direto_auth_hook_test.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/historico_status_os_test.sql
          # Suites que queimam valores de sequencia: so rodam com a trava de
          # banco descartavel ligada.
          PGOPTIONS='-c sigauto.ambiente_teste=on' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/regras_negocio_test.sql
          PGOPTIONS='-c sigauto.ambiente_teste=on' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/regras_negocio_servidor_test.sql
          PSQL="psql $DATABASE_URL" SIGAUTO_BANCO_DESCARTAVEL=1 bash database/tests/concorrencia_os_estoque.sh
          node database/tests/login_direto_auth_hook.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: react-app
      - run: npm run test:e2e -- --workers=1
        working-directory: react-app
        env:
          CI: true
          VITE_API_URL: http://localhost:3001/api/v1
          FRONTEND_URL: http://localhost:5173
